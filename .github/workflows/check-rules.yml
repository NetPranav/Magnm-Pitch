name: Anti-Hijacking Rules Check

on:
  push:
    branches: [main, feat/*, feature/*, fix/*, refactor/*]
  pull_request:
    branches: [main]

jobs:
  validate-rules:
    name: Architecture & Anti-Hijacking Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Rule Verification
        run: npm run check-rules

      - name: Test Production Build
        run: npm run build
